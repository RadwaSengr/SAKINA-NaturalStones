services:
  - type: web
    name: sakina-natural-stones
    runtime: node
    plan: free
    buildCommand: pnpm install && pnpm build
    startCommand: pnpm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: OWNER_OPEN_ID
        value: sakina_owner_admin
      - key: VITE_ANALYTICS_ENDPOINT
        value: https://manus-analytics.com
      - key: VITE_ANALYTICS_WEBSITE_ID
        value: 491466ae-a255-4dac-9ea0-c41de231715b
